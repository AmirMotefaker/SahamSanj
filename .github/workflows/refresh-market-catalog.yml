name: Refresh official market catalog

on:
  workflow_dispatch:
  push:
    branches:
      - chore/repository-foundation
    paths:
      - ".github/workflows/refresh-market-catalog.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe official legacy market workbook
        run: |
          python3 - <<'PY'
          import io
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET

          url = "https://old.tsetmc.com/tsev2/excel/MarketWatchPlus.aspx?d=0"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://www.tsetmc.com/MarketWatch",
                  "Accept": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, */*",
              },
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              content = response.read()
              print("legacy_status=", response.status)
              print("legacy_content_type=", response.headers.get("Content-Type"))
              print("legacy_bytes=", len(content))

          if len(content) < 10000 or content[:2] != b"PK":
              raise RuntimeError("Legacy endpoint did not return a usable XLSX workbook.")

          with zipfile.ZipFile(io.BytesIO(content)) as workbook:
              names = workbook.namelist()
              print("xlsx_entries=", len(names))
              print("xlsx_has_sheet=", "xl/worksheets/sheet1.xml" in names)

              shared = []
              if "xl/sharedStrings.xml" in names:
                  root = ET.fromstring(workbook.read("xl/sharedStrings.xml"))
                  ns = "{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
                  for item in root.findall(f"{ns}si"):
                      shared.append("".join(node.text or "" for node in item.iter(f"{ns}t")))

              sheet = ET.fromstring(workbook.read("xl/worksheets/sheet1.xml"))
              ns = "{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"

              for number, row in enumerate(sheet.findall(f".//{ns}row")[:5], start=1):
                  values = []
                  for cell in row.findall(f"{ns}c"):
                      value = cell.find(f"{ns}v")
                      if value is None:
                          values.append("")
                          continue
                      raw = value.text or ""
                      values.append(shared[int(raw)] if cell.get("t") == "s" else raw)
                  print(f"row_{number}=", values[:20])
          PY

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f public/market-catalog.json || exit 0`n          git add public/market-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): refresh official market catalog"
          git push