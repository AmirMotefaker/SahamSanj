name: Inspect packaged instrument snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - chore/repository-foundation
    paths:
      - ".github/workflows/refresh-market-catalog.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect tse-client package contents
        run: |
          mkdir -p /tmp/tse-package
          cd /tmp/tse-package
          npm pack tse-client@2.27.5
          tar -xzf tse-client-2.27.5.tgz

          echo "=== فایل‌های مرتبط با ابزارها ==="
          find package -type f | grep -Ei 'instrument|market|symbol|static|data|json|csv' | head -n 200 || true

          echo "=== فایل‌های بزرگ‌تر از 50KB ==="
          find package -type f -size +50k -printf '%s %p\n' | sort -nr | head -n 80 || true

          echo "=== جست‌وجوی عبارت فولاد در پکیج ==="
          grep -RIl --exclude='*.map' 'فولاد' package | head -n 40 || true

          echo "=== اندازهٔ کل پکیج ==="
          du -sh package