name: Refresh official market catalog

on:
  workflow_dispatch:
  push:
    branches:
      - chore/repository-foundation
    paths:
      - ".github/workflows/refresh-market-catalog.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog from official public sources
        run: |
          node <<'NODE'
          const marketUrl = "https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&showTraded=false&withBestLimits=true&hEven=0&RefID=0&paperTypes%5B0%5D=1&paperTypes%5B1%5D=2&paperTypes%5B2%5D=3&paperTypes%5B3%5D=4&paperTypes%5B4%5D=5&paperTypes%5B5%5D=6&paperTypes%5B6%5D=7&paperTypes%5B7%5D=8&paperTypes%5B8%5D=9";
          const staticUrl = "https://cdn.tsetmc.com/api/StaticData/GetStaticData";

          async function getJson(url) {
            let lastError;
            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    Accept: "application/json, text/plain, */*",
                    Referer: "https://www.tsetmc.com/MarketWatch",
                  },
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const payload = await response.json();
                if (!payload) throw new Error("empty payload");
                return payload;
              } catch (error) {
                lastError = error;
                await new Promise((resolve) => setTimeout(resolve, attempt * 3000));
              }
            }
            throw lastError;
          }

          const [market, staticData] = await Promise.all([
            getJson(marketUrl),
            getJson(staticUrl),
          ]);

          const groupNames = new Map(
            (staticData.staticData || [])
              .filter((item) => item.type === "IndustrialGroup")
              .map((item) => [String(item.code).trim(), String(item.name).trim()])
          );

          const buckets = new Map();

          for (const record of market.marketwatch || []) {
            const id = String(record.insCode || "").trim();
            const symbol = String(record.lva || "").trim();
            const name = String(record.lvc || "").trim();

            if (!/^\d{8,24}$/.test(id) || !symbol) continue;

            const code = String(record.csv || "").trim() || "other";
            if (!buckets.has(code)) buckets.set(code, []);
            buckets.get(code).push({ id, symbol, name });
          }

          const groups = [...buckets.entries()]
            .map(([code, symbols]) => ({
              code,
              name: groupNames.get(code) || "سایر ابزارهای بازار",
              symbols: symbols.sort((a, b) => a.symbol.localeCompare(b.symbol, "fa")),
            }))
            .sort((a, b) => a.name.localeCompare(b.name, "fa"));

          if (groups.length < 20) throw new Error("Official catalog is unexpectedly incomplete.");

          const catalog = {
            source: "فهرست عمومی رسمی بازار",
            generatedAt: new Date().toISOString(),
            groups,
          };

          await (await import("node:fs/promises")).writeFile(
            "public/market-catalog.json",
            JSON.stringify(catalog),
            "utf8"
          );

          console.log(`groups=${groups.length}`);
          console.log(`symbols=${groups.reduce((sum, group) => sum + group.symbols.length, 0)}`);
          NODE

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): refresh official market catalog"
          git push