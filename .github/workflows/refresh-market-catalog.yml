name: Probe market catalogue snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - chore/repository-foundation
    paths:
      - ".github/workflows/refresh-market-catalog.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe packaged instruments snapshot
        run: |
          npm exec --yes --package=tse-client@2.27.5 tse i --cols "InsCode,Symbol,Name,CSecVal" --header > /tmp/instruments.csv
          test -s /tmp/instruments.csv
          echo "rows=$(tail -n +2 /tmp/instruments.csv | wc -l)"
          echo "bytes=$(wc -c < /tmp/instruments.csv)"
          head -n 5 /tmp/instruments.csv