name: Refresh public market snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - chore/repository-foundation
    paths:
      - scripts/refresh-market-snapshot.mjs
      - .github/workflows/market-snapshot.yml
  schedule:
    - cron: "*/15 * * * 0-4"

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/refresh-market-snapshot.mjs
      - run: |
          if git diff --quiet -- public/market-snapshot.json; then
            echo "No data change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-snapshot.json
          git commit -m "data: refresh public market snapshot"
          git push
